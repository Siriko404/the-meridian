<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Roulette — FEEL samples</title>
<style>
:root{--fg:#fff;--bg:#000;--mut:#666;--red:#e01313;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:var(--fg);font-family:"Helvetica Neue",Arial,sans-serif;padding:26px 18px 60px}
h1{font-family:var(--mono);font-size:15px;letter-spacing:.3em;text-transform:uppercase;text-align:center}
p.note{color:var(--mut);font-size:12px;text-align:center;margin:8px 0 24px;letter-spacing:.05em}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px;max-width:1500px;margin:0 auto}
.card{border:1px solid #222;background:var(--bg);display:flex;flex-direction:column}
.hd{display:flex;align-items:baseline;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #1c1c1c}
.hd .n{font-family:var(--mono);font-size:22px}
.hd .t{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.hd .dna{color:var(--mut);font-size:11px;text-align:right;max-width:55%;line-height:1.35}
.stage{position:relative;aspect-ratio:1/1.18;overflow:hidden;background:var(--bg)}
.inner{position:absolute;inset:0;transition:transform .3s,filter .3s}
/* seats on a ring */
.seat{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:1.5px solid var(--fg);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px}
.seat .dotf{width:14px;height:14px;border-radius:50%;background:var(--fg)}
.seat .doth{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--fg)}
.seat .nm{position:absolute;top:100%;margin-top:4px;font-size:11px;color:var(--mut)}
.pips{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);display:flex;gap:3px}
.pips i{width:6px;height:6px;background:var(--fg);display:block;transition:opacity .2s,transform .2s}
.pips i.gone{opacity:0;transform:translateY(6px)}
/* center gun: a heavy arm that aims */
.gun{position:absolute;left:50%;top:50%;width:31%;height:4px;background:var(--fg);transform-origin:0 50%;border-radius:2px;
  transition:transform .5s cubic-bezier(.4,0,.2,1)}
.gun:after{content:"";position:absolute;right:-7px;top:50%;width:12px;height:12px;border-radius:50%;background:var(--fg);transform:translateY(-50%)}
.hub{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border:1.5px solid var(--fg);border-radius:50%}
/* effects */
.flash{position:absolute;inset:0;background:var(--fg);opacity:0;pointer-events:none}
.flash.red{background:var(--red)}
.vig{position:absolute;inset:-2%;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 46%,transparent 34%,#000 78%)}
.stamp{position:absolute;left:0;right:0;top:2%;text-align:center;font-family:var(--mono);letter-spacing:.12em;
  font-size:21px;opacity:0;white-space:pre-line;line-height:1.5}
.stamp.red{color:var(--red)}
.sub{position:absolute;left:0;right:0;top:9.5%;text-align:center;font-family:var(--mono);font-size:12px;color:var(--mut);letter-spacing:.16em;opacity:0}
/* dealer strip: dice + cards */
.deal{position:absolute;left:0;right:0;bottom:3%;display:flex;gap:8px;justify-content:center;align-items:center}
.die{width:34px;height:34px;border:1.5px solid var(--fg);border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:17px;opacity:0}
.cardp{border:1px solid var(--fg);padding:5px 9px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;opacity:0;background:var(--bg)}
.shard{position:absolute;width:5px;height:5px;background:var(--fg);opacity:0}
/* per-register helpers */
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(3px,-2px)}}
.inner.shake{animation:shake .34s linear}
@keyframes jelly{0%{transform:scale(1)}30%{transform:scale(1.05,.94)}55%{transform:scale(.96,1.05)}75%{transform:scale(1.02,.98)}100%{transform:scale(1)}}
.inner.jelly{animation:jelly .5s ease}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.02)}}
.inner.heart{animation:beat 1s ease-in-out infinite}
.ft{padding:10px 14px;border-top:1px solid #1c1c1c;display:flex;justify-content:space-between;align-items:center}
.ft button{font:inherit;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg);
  background:none;border:1px solid var(--fg);padding:7px 14px;cursor:pointer}
.ft button:active{background:var(--fg);color:var(--bg)}
.ft .st{font-family:var(--mono);font-size:11px;color:var(--mut)}
</style></head><body>
<h1>The same moment · four registers</h1>
<p class="note">One turn: aim → trigger → outcome → the dealer deals. B&amp;W + ONE red (danger only) — locked. Loops alternate BANG / CLICK. Pick a number, or a mix ("1's gun + 3's deal").</p>
<div id="grid"></div>
<script>
"use strict";
const REG = [
 {n:1, t:"Heavy dread · crisp ritual", dna:"gun = slow, heavy, breath-hold.\neverything procedural = fast, casino-crisp.",
  aim:1500, hold:420, deal:"crisp"},
 {n:2, t:"Full horror dread", dna:"everything slow. vignette closes in,\nthe table breathes. maximum weight.",
  aim:2900, hold:700, deal:"slow"},
 {n:3, t:"Party energy", dna:"fast, bouncy, elastic. relief is loud.\ntension thins, fun thickens.",
  aim:420, hold:90, deal:"bounce"},
 {n:4, t:"Cold executioner", dna:"no anticipation. hard cuts, ledger stamps.\nthe dealer has no feelings.",
  aim:240, hold:60, deal:"stamp"},
];
const SEATS = 5, R = 39;                       // ring radius (% of stage)
const pos = i => { const a = (-90 + i*360/SEATS) * Math.PI/180;
                   return { x: 50 + 36*Math.cos(a), y: 50 + 32*Math.sin(a) }; };
const wait = ms => new Promise(r => setTimeout(r, ms));

function build(reg){
  const card = document.createElement("div"); card.className = "card";
  card.innerHTML = `
   <div class="hd"><div><span class="n">${reg.n}</span>&nbsp; <span class="t">${reg.t}</span></div><div class="dna">${reg.dna.replace("\n","<br>")}</div></div>
   <div class="stage"><div class="inner">
     ${[...Array(SEATS)].map((_,i)=>{const p=pos(i);return `
       <div class="seat" data-i="${i}" style="left:${p.x}%;top:${p.y}%">
         ${i%2? '<div class="doth"></div>':'<div class="dotf"></div>'}<div class="nm">P${i}</div>
         <div class="pips"><i></i><i></i><i></i></div></div>`;}).join("")}
     <div class="hub"></div><div class="gun"></div>
     <div class="deal"><div class="die"></div><div class="cardp c1"></div><div class="cardp c2"></div></div>
     <div class="stamp"></div><div class="sub"></div><div class="vig"></div>
   </div><div class="flash white"></div><div class="flash red"></div></div>
   <div class="ft"><span class="st"></span><button>replay</button></div>`;
  document.getElementById("grid").appendChild(card);
  const el = s => card.querySelector(s);
  const seats = [...card.querySelectorAll(".seat")];
  let live = true, running = false, epoch = 0;

  const aimAt = i => { el(".gun").style.transform = `rotate(${-90 + i*360/SEATS}deg)`; };
  const stamp = (txt, red, show=1) => { const s = el(".stamp");
    s.textContent = txt; s.classList.toggle("red", !!red); s.style.opacity = show; };
  const sub = (txt, show=1) => { const s = el(".sub"); s.textContent = txt; s.style.opacity = show; };
  const flash = (red, ms) => { const f = el(red ? ".flash.red" : ".flash.white");
    f.animate([{ opacity: red ? .92 : .8 }, { opacity: 0 }], { duration: ms, easing: "ease-out" }); };
  const pip = (seat, k) => { const ps = seats[seat].querySelectorAll(".pips i");
    for (let j = ps.length-1, c = 0; j >= 0 && c < k; j--) if (!ps[j].classList.contains("gone")) { ps[j].classList.add("gone"); c++; } };
  const reset = () => { seats.forEach(s => s.querySelectorAll(".pips i").forEach(p => p.classList.remove("gone")));
    el(".inner").style.filter = ""; el(".inner").style.transform = ""; el(".vig").style.opacity = 0;
    ["die","c1","c2"].forEach(c => { const d = el("."+c.replace(/^(c\d)$/,"cardp.$1")) || el("."+c); });
    el(".die").style.opacity = 0; card.querySelectorAll(".cardp").forEach(c => { c.style.opacity = 0; c.style.transform = ""; c.style.transition = "none"; });
    stamp("",0,0); sub("",0); aimAt(0); };

  async function dealBeat(kind, my){
    const die = el(".die"), c1 = card.querySelectorAll(".cardp")[0], c2 = card.querySelectorAll(".cardp")[1];
    c1.textContent = "MAGNIFIER"; c2.textContent = "BEER";
    sub("DEALER · DRAW 2");
    if (kind === "crisp"){ die.style.opacity = 1;
      for (const v of [3,6,2,5]) { die.textContent = v; await wait(90); if (my !== epoch) return; }
      for (const [c,tx] of [[c1,140],[c2,140]]){ c.style.transition = "transform .14s ease-out,opacity .14s";
        c.style.transform = "translateY(14px)"; c.style.opacity = 1;
        requestAnimationFrame(() => c.style.transform = ""); await wait(tx); if (my !== epoch) return; } }
    if (kind === "slow"){ die.style.opacity = 1;
      for (const v of [1,4,2,6,3,5]) { die.textContent = v; await wait(340); if (my !== epoch) return; }
      for (const c of [c1,c2]){ c.style.transition = "opacity 1.4s"; c.style.opacity = 1; await wait(900); if (my !== epoch) return; } }
    if (kind === "bounce"){ die.style.opacity = 1;
      for (const v of [6,2,5,1,3]) { die.textContent = v; await wait(70); if (my !== epoch) return; }
      for (const c of [c1,c2]){ c.style.transition = "transform .5s cubic-bezier(.2,2.4,.4,1),opacity .12s";
        c.style.transform = "translateY(60px) scale(.4)"; c.style.opacity = 1;
        requestAnimationFrame(() => c.style.transform = ""); await wait(180); if (my !== epoch) return; } }
    if (kind === "stamp"){ die.style.opacity = 1; die.textContent = "·";
      for (const c of [c1,c2]){ c.style.transition = "none"; c.style.opacity = 1; await wait(150); if (my !== epoch) return; } }
    await wait(700);
  }

  async function run(){
    if (running) epoch++;
    running = true; const my = ++epoch;
    reset(); el(".ft .st").textContent = live ? "this loop: LIVE shell" : "this loop: BLANK";
    const inner = el(".inner"), shooter = 1, target = 3;
    await wait(500); if (my !== epoch) return;

    stamp(`P${shooter} → P${target}`); aimAt(target);
    if (reg.n === 2){ inner.classList.add("heart"); el(".vig").style.transition = `opacity ${reg.aim}ms`; el(".vig").style.opacity = .95; }
    if (reg.n === 1){ inner.style.transition = `transform ${reg.aim}ms cubic-bezier(.2,.7,.3,1),filter ${reg.aim}ms`;
      inner.style.transform = "scale(1.06)"; inner.style.filter = "brightness(.72)"; }
    if (reg.n === 3){ inner.classList.remove("jelly"); void inner.offsetWidth; }
    await wait(reg.aim); if (my !== epoch) return;

    if (reg.n !== 4){ sub(reg.n === 3 ? "!!!" : "· · ·"); }         // the breath-hold
    await wait(reg.hold); if (my !== epoch) return;

    inner.classList.remove("heart");
    if (live){
      flash(true, reg.n === 2 ? 900 : reg.n === 3 ? 300 : 200);
      if (reg.n === 3) inner.classList.add("jelly"); else { inner.classList.remove("shake"); void inner.offsetWidth; inner.classList.add("shake"); }
      stamp(reg.n === 4 ? `P${target} · LIVE · −1` : "BANG", true); pip(target, 1);
    } else {
      if (reg.n === 3){ inner.classList.add("jelly");
        for (let i = 0; i < 14; i++){ const s = document.createElement("div"); s.className = "shard"; const p = pos(target);
          s.style.left = p.x+"%"; s.style.top = p.y+"%"; el(".inner").appendChild(s);
          const a = Math.random()*6.28, d = 40+Math.random()*50;
          s.animate([{opacity:1,transform:"translate(0,0)"},{opacity:0,transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`}],{duration:480,easing:"ease-out"});
          setTimeout(() => s.remove(), 500); } }
      else flash(false, 130);
      stamp(reg.n === 4 ? `P${target} · BLANK · 0` : "CLICK", false);
    }
    inner.style.transform = ""; inner.style.filter = ""; el(".vig").style.opacity = 0;
    await wait(reg.n === 2 ? 1600 : reg.n === 3 ? 700 : 1000); if (my !== epoch) return;

    stamp("", 0, 0);
    await dealBeat(reg.deal, my); if (my !== epoch) return;
    live = !live; running = false;
    setTimeout(() => { if (my === epoch) run(); }, 1200);           // loop
  }
  card.querySelector(".ft button").onclick = () => run();
  run();
}
REG.forEach(build);
</script></body></html>
