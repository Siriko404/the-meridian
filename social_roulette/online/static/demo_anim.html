<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reveal styles — Social Roulette</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#000; color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  body{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:64px; min-height:100vh; }
  .row{ display:flex; flex-direction:column; align-items:center; gap:18px; }
  .cap{ font-size:12px; letter-spacing:.28em; text-transform:uppercase; opacity:1; color:#fff; }
  .cap b{ font-weight:400; border-bottom:1px solid #fff; padding-bottom:3px; }
  .demo{ height:88px; display:flex; align-items:center; justify-content:center; }
  .replay{ font:inherit; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#fff;
    background:#000; border:1px solid #fff; border-radius:999px; padding:6px 14px; cursor:pointer; }
  .replay:hover{ background:#fff; color:#000; }

  /* A — zoomIn reveal (airforce): fade + scale-up 0.8→1, then fade-scale out */
  .reveal{ font-size:52px; font-weight:700; letter-spacing:.02em; }
  .reveal.play{ animation:reveal 3.4s cubic-bezier(.16,1,.3,1) infinite; }
  @keyframes reveal{
    0%{opacity:0; transform:scale3d(.8,.8,.8)} 12%{opacity:1; transform:scale3d(1,1,1)}
    68%{opacity:1; transform:scale3d(1,1,1)} 84%,100%{opacity:0; transform:scale3d(.86,.86,.86)} }

  /* B — bracket-draw frame around the text */
  .frame{ position:relative; font-size:40px; font-weight:600; letter-spacing:.04em; padding:14px 34px; }
  .frame::before,.frame::after{ content:""; position:absolute; top:0; bottom:0; width:1.5px; background:#fff; transform:scaleY(0); }
  .frame::before{ left:0; transform-origin:top; } .frame::after{ right:0; transform-origin:bottom; }
  .frame.play::before,.frame.play::after{ animation:bracket 3.4s cubic-bezier(.86,0,.07,1) infinite; }
  @keyframes bracket{ 0%,100%{transform:scaleY(0)} 22%,74%{transform:scaleY(1)} }

  /* C — fill-sweep (invert): white bar sweeps across, text inverts under it */
  .sweep{ position:relative; font-size:40px; font-weight:600; letter-spacing:.04em; padding:14px 30px; overflow:hidden; border:1px solid #fff; }
  .sweep .txt{ position:relative; mix-blend-mode:difference; color:#fff; }
  .sweep .fill{ position:absolute; inset:-1px; background:#fff; transform:scaleX(0); transform-origin:left; }
  .sweep.play .fill{ animation:sweep 3.4s cubic-bezier(.86,0,.07,1) infinite; }
  @keyframes sweep{ 0%{transform:scaleX(0);transform-origin:left} 40%,58%{transform:scaleX(1);transform-origin:left}
    59%{transform-origin:right} 100%{transform:scaleX(0);transform-origin:right} }

  @media (prefers-reduced-motion:reduce){ .reveal,.frame::before,.frame::after,.sweep .fill{ animation:none } }
</style></head><body>

  <div class="row">
    <div class="cap"><b>A — fade + scale reveal</b> &nbsp; (airforce zoomIn · appear / disappear)</div>
    <div class="demo"><div class="reveal play" id="a">SHOOT</div></div>
    <button class="replay" data-t="a">▷ replay</button>
  </div>

  <div class="row">
    <div class="cap"><b>B — bracket-draw frame</b> &nbsp; (lines draw in around the text)</div>
    <div class="demo"><div class="frame play" id="b">VIEW ALL</div></div>
    <button class="replay" data-t="b">▷ replay</button>
  </div>

  <div class="row">
    <div class="cap"><b>C — fill-sweep invert</b> &nbsp; (bar sweeps, text inverts)</div>
    <div class="demo"><div class="sweep play" id="c"><span class="fill"></span><span class="txt">CONFIRM</span></div></div>
    <button class="replay" data-t="c">▷ replay</button>
  </div>

<script>
  document.querySelectorAll('.replay').forEach(btn=>btn.onclick=()=>{
    const el=document.getElementById(btn.dataset.t);
    el.classList.remove('play'); void el.offsetWidth; el.classList.add('play');
  });
</script></body></html>
