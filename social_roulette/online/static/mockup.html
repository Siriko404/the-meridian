<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Roulette — mockup</title>
<style>
  :root{ --w:440px; --seat:82px; --ease:cubic-bezier(.16,1,.3,1); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#000; color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden; }
  body{ display:flex; flex-direction:column; align-items:center; }

  .brand{ height:96px; display:flex; align-items:center; justify-content:center; opacity:0;
    animation:fade 1.1s var(--ease) .1s forwards; }
  .brand img{ height:150px; width:auto; margin-top:26px; filter:none; }

  /* ---- round table ---- */
  .stage{ position:relative; width:var(--w); height:var(--w); flex:0 0 auto; margin-top:-18px; }

  .seat{ position:absolute; width:var(--seat); height:var(--seat); border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    transform:translate(-50%,-50%) scale(.2); opacity:0;
    transition:transform .6s var(--ease), box-shadow .45s var(--ease), opacity .5s var(--ease);
    letter-spacing:.04em; }
  .seat .id{ font-size:13px; font-weight:600; letter-spacing:.14em; }
  .seat .pips{ display:flex; gap:4px; }
  .seat .pips i{ width:5px; height:5px; border-radius:50%; display:block; }

  /* team = FORM not color: filled disc vs hollow ring. pure #000/#fff. */
  .seat.a{ background:#fff; color:#000; }
  .seat.a .pips i{ background:#000; }
  .seat.b{ background:#000; color:#fff; border:1.5px solid #fff; }
  .seat.b .pips i{ background:#fff; }
  .seat.shown{ transform:translate(-50%,-50%) scale(1); opacity:1; }

  .seat.current{ box-shadow:0 0 0 3px #000, 0 0 0 4.5px #fff; }
  .seat.dead{ opacity:1; }
  .seat.dead::after{ content:"✕"; position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; font-size:44px; font-weight:300; color:#fff; }
  .seat.dead.a::after{ color:#000; }
  .seat.dead .id,.seat.dead .pips{ visibility:hidden; }

  /* ---- centre: the cylinder + barrel ---- */
  .core{ position:absolute; left:50%; top:50%; width:150px; height:150px; transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center; }
  .cyl{ width:120px; height:120px; border-radius:50%; border:1.5px solid #fff; position:relative;
    animation:spin 26s linear infinite; }
  .cyl b{ position:absolute; left:50%; top:50%; width:8px; height:8px; border-radius:50%; background:#fff;
    transform-origin:0 0; }
  .cyl b.spent{ background:#000; border:1.5px solid #fff; width:8px; height:8px; }
  .count{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:26px; font-weight:200; letter-spacing:.02em; animation:spin 26s linear infinite reverse; }
  .barrel{ position:absolute; left:50%; top:50%; height:2px; width:150px; background:#fff;
    transform-origin:0 50%; transform:rotate(-90deg); transition:transform .5s var(--ease); opacity:.9; }

  /* ---- your dock: hand + actions ---- */
  .dock{ position:fixed; bottom:0; left:0; right:0; padding:18px 20px 26px;
    display:flex; flex-direction:column; align-items:center; gap:14px; }
  .hand{ display:flex; gap:10px; }
  .card{ width:58px; height:80px; border:1.5px solid #fff; border-radius:8px; background:#000;
    display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:300;
    transform:translateY(120px); opacity:0; transition:transform .55s var(--ease), background .18s, color .18s; }
  .card:hover{ background:#fff; color:#000; cursor:pointer; }
  .card.dealt{ transform:translateY(0); opacity:1; }
  .acts{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:640px; }
  .btn{ border:1px solid #fff; background:#000; color:#fff; font:inherit; font-size:13px;
    letter-spacing:.06em; padding:9px 15px; border-radius:999px; cursor:pointer;
    transition:background .16s, color .16s, transform .08s; }
  .btn:hover{ background:#fff; color:#000; }
  .btn:active{ transform:translateY(1px); }
  .btn.solid{ background:#fff; color:#000; }
  .btn.solid:hover{ background:#000; color:#fff; }

  /* ---- the shot: white-flash inversion ---- */
  .flash{ position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:50; }
  .flash.live{ animation:flash .5s ease-out; }
  .shudder{ animation:shudder .4s ease-in-out; }

  @keyframes fade{ to{ opacity:1; } }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes flash{ 0%{opacity:0} 6%{opacity:1} 12%{opacity:.9} 100%{opacity:0} }
  @keyframes shudder{ 0%,100%{transform:translate(-50%,-50%)} 25%{transform:translate(calc(-50% - 4px),-50%)} 75%{transform:translate(calc(-50% + 4px),-50%)} }

  @media (prefers-reduced-motion: reduce){
    .cyl,.count{ animation:none; } .seat{ transition:box-shadow .2s; }
  }
</style></head><body>

<div class="brand"><img src="./logo.jpeg" alt="Social Roulette"></div>

<div class="stage" id="stage">
  <div class="core" id="core">
    <div class="cyl" id="cyl"></div>
    <div class="count" id="count">6</div>
  </div>
  <div class="barrel" id="barrel"></div>
</div>

<div class="dock">
  <div class="hand" id="hand"></div>
  <div class="acts" id="acts"></div>
</div>

<div class="flash" id="flash"></div>

<script>
  const N=5, R=150, cx=220, cy=220;
  const teams=['a','b','a','b','a'];         // filled / hollow
  const lives=[3,3,2,3,3];
  const dead=[false,false,false,false,false];
  let current=0;
  const stage=document.getElementById('stage');
  const seats=[];

  function place(i){
    const ang=(-90 + i*(360/N))*Math.PI/180;
    const x=cx+R*Math.cos(ang), y=cy+R*Math.sin(ang);
    const s=document.createElement('div');
    s.className='seat '+teams[i];
    s.style.left=x+'px'; s.style.top=y+'px';
    s.innerHTML=`<span class="id">P${i}</span><span class="pips">${'<i></i>'.repeat(lives[i])}</span>`;
    stage.appendChild(s); seats[i]=s;
    setTimeout(()=>s.classList.add('shown'), 180+i*120);
  }
  for(let i=0;i<N;i++) place(i);

  // cylinder shells
  const cyl=document.getElementById('cyl'); const shells=11, liveN=6;
  for(let k=0;k<shells;k++){
    const b=document.createElement('b');
    const a=(k/shells)*2*Math.PI - Math.PI/2, r=52;
    b.style.transform=`translate(${r*Math.cos(a)-4}px,${r*Math.sin(a)-4}px)`;
    if(k>=liveN) b.classList.add('spent');
    cyl.appendChild(b);
  }

  function pointTo(i){
    const ang=-90 + i*(360/N);
    document.getElementById('barrel').style.transform=`rotate(${ang}deg)`;
    seats.forEach((s,j)=>s.classList.toggle('current', j===i && !dead[j]));
  }
  setTimeout(()=>pointTo(current), 1000);

  // hand
  const items=['B','H','M','S'];
  const hand=document.getElementById('hand');
  items.forEach((g,k)=>{ const c=document.createElement('div'); c.className='card'; c.textContent=g;
    hand.appendChild(c); setTimeout(()=>c.classList.add('dealt'), 900+k*110); });

  // actions
  const acts=document.getElementById('acts');
  [['Shoot P1'],['Shoot yourself'],['Use Magnifier'],['Handcuffs on P3'],['Flip P2']].forEach((a,i)=>{
    const b=document.createElement('button'); b.className='btn'+(i===0?' solid':''); b.textContent=a[0];
    b.onclick=()=>fire((i===1)?0:(i===0?1:3), Math.random()<.55);
    acts.appendChild(b);
  });

  function fire(target, isLive){
    pointTo(target);
    const core=document.getElementById('core');
    setTimeout(()=>{
      if(isLive){
        document.getElementById('flash').classList.remove('live'); void document.getElementById('flash').offsetWidth;
        document.getElementById('flash').classList.add('live');
        core.classList.remove('shudder'); void core.offsetWidth; core.classList.add('shudder');
        if(lives[target]>0 && !dead[target]){ lives[target]--; redraw(target);
          if(lives[target]===0){ dead[target]=true; seats[target].classList.add('dead'); } }
      } else { core.classList.remove('shudder'); void core.offsetWidth; core.classList.add('shudder'); }
      const c=document.getElementById('count'); c.textContent=Math.max(0, (+c.textContent)-1);
      setTimeout(()=>{ current=(current+1)%N; while(dead[current]) current=(current+1)%N; pointTo(current); }, 700);
    }, 520);
  }
  function redraw(i){ seats[i].querySelector('.pips').innerHTML='<i></i>'.repeat(lives[i]); }
</script></body></html>
