<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>THE MERIDIAN</title>
<link rel="stylesheet" href="/static/game/game.css">
</head><body>
<div id="stage"></div>

<section id="join" class="overlay on">
  <div class="brand">THE MERIDIAN</div>
  <div class="sub">LAST SERVICE · CAR 4</div>
  <input id="name" placeholder="YOUR NAME" autocomplete="off" maxlength="16">
  <input id="code" placeholder="INVITE CODE — BLANK = NEW" autocomplete="off" maxlength="8">
  <button id="enterbtn">BOARD</button>
  <p class="hint">A blank code opens a new car. Share the code next. Empty seats become agents of the house.</p>
  <p class="hint">ART: JJ99 (PORTRAITS) · DARKMOONFIRE (ICONS)</p>
</section>

<section id="lobby" class="overlay">
  <div class="sub">CAR</div><div id="lcode" class="code"></div>
  <div id="members"></div>
  <button id="startbtn" style="display:none">DEPART</button>
  <p class="hint">The conductor departs; empty seats fill with bots.</p>
</section>

<div id="chatsheet">
  <div id="chatlog"></div>
  <div class="row"><input id="chatin" placeholder="say something…" autocomplete="off" maxlength="200"><button id="chatsend">SEND</button></div>
</div>
<div id="banner"></div>

<script src="/static/vendor/phaser.min.js"></script>
<script src="/static/game/js/theme.js"></script>
<script src="/static/game/js/dice.js"></script>
<script src="/static/game/js/net.js"></script>
<script src="/static/game/js/scene.js"></script>
<script src="/static/game/js/choreo.js"></script>
<script src="/static/game/js/trays.js"></script>
<script src="/static/game/js/main.js"></script>
</body></html>
