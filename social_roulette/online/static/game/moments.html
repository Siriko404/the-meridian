<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MOMENTS — ratification gallery</title>
<style>
  html,body{margin:0;padding:0;background:#000;height:100svh;overflow:hidden;position:fixed;inset:0;width:100%}
  #stage{width:min(100vw,440px);height:100svh;margin:0 auto}
  canvas{image-rendering:pixelated}
  #hud{position:fixed;top:4px;left:50%;transform:translateX(-50%);z-index:10;color:#0f0;
    font:bold 13px Consolas,monospace;background:#000;padding:2px 10px;border:1px solid #0f0}
</style></head><body>
<div id="stage"></div><div id="hud">TAP = NEXT MOMENT</div>
<script src="/static/vendor/phaser.min.js"></script>
<script src="/static/game/js/theme.js"></script>
<script src="/static/game/js/dice.js"></script>
<script src="/static/game/js/net.js"></script>
<script src="/static/game/js/scene.js"></script>
<script src="/static/game/js/choreo.js"></script>
<script>
(function () {
  "use strict";
  const hud = document.getElementById("hud");
  // ---- canned base: 5 seats, 3-2 split, you = 0, full hands ----
  const BASE = () => ({
    you: 0, order: [0, 1, 2, 3, 4], current: 0, winner: null, gen: 1,
    phase: "talk", phase_ends_at: null, server_now: 0, bonus: false, extra_turn: false,
    poison_armed: false, teams_active: true, flipback_discount: false,
    use_counts: {}, use_limit: 6, feed: [],
    players: [
      { id: 0, team: "RED",  cover: 3, alive: true, handcuffed: false, immune_from: [] },
      { id: 1, team: "BLUE", cover: 3, alive: true, handcuffed: false, immune_from: [] },
      { id: 2, team: "RED",  cover: 2, alive: true, handcuffed: true,  immune_from: [3] },
      { id: 3, team: "BLUE", cover: 3, alive: true, handcuffed: false, immune_from: [] },
      { id: 4, team: "RED",  cover: 1, alive: true, handcuffed: false, immune_from: [] },
    ],
    your_hand: { MAGNET: 1, GEIGER: 1, PASSPORT: 1 },
    item_counts: { MAGNET: 3, SHAKEDOWN: 2, GEIGER: 2, POISON: 1, PASSPORT: 3, TERMS: 2 },
    scan: null,
  });
  const ROSTER = { "0": "you" };                       // seat 0 human; 1–4 = codenames
  const dead4 = () => { const v = BASE(); v.players[4].alive = false; v.players[4].cover = 0; return v; };

  const MOMENTS = [
    ["ICON STRIP (pick GEIGER/MAGNET/SHAKEDOWN/LEDGER)", async (s) => {
      const layer = s.add.container(0, 0).setDepth(30);
      layer.add(s.add.rectangle(195, 422, 390, 844, 0x000000, 0.97));
      for (let i = 0; i < 45; i++) {
        const x = 36 + (i % 8) * 44, y = 130 + Math.floor(i / 8) * 58;
        layer.add(s.add.image(x, y, "icons", i).setScale(2));
        layer.add(s.add.text(x, y + 22, String(i), { fontFamily: "Consolas,monospace", fontSize: "13px",
          color: "#ffffff" }).setOrigin(0.5).setResolution(2));
      }
      await new Promise((r) => s.input.once("pointerdown", r));
      layer.destroy();
    }],
    ["M1-M5 SETUP CEREMONY", (s) => CHOREO.setup(s, BASE(), ROSTER, { total: 8, live: 4 })],
    ["M6 TURN ADVANCE", async (s) => { await s.dialTo(1, false); await s.dialTo(2, false); }],
    ["M8 DECISION BAND (invert + red final 5s)", async (s) => {
      for (let t = 12; t >= 0; t--) { s.setBand({ phase: "decision", secs: t, name: "VESPER", invert: true }); await s.w(220); }
      s.setBand({ phase: "talk", secs: 60, name: "VESPER" });
    }],
    ["M9 TIMEOUT FINE (anonymous)", (s) => CHOREO.play(s, [{ type: "fine", actor: 3 }], BASE(), BASE(), ROSTER)],
    ["M10+M12 AUTO SELF-SHOOT (LIVE)", async (s) => {
      s.setBand({ phase: "decision", secs: 0, name: "NOMAD", note: "NO ASSETS · THE HANDLER DECIDES", invert: true });
      await CHOREO.play(s, [{ type: "shot", actor: 3, target: 3, bullet: "LIVE", damage: 1, killed: false }], BASE(), BASE(), ROSTER);
      s.setBand({ phase: "talk", secs: 60, name: "" });
    }],
    ["M11 TARGET BRACKETS (red)", async (s) => {
      s.setTargets([1, 3], null); await s.w(1800); s.clearTargets();
    }],
    ["M12 SHOT — BLANK CLICK", (s) => CHOREO.play(s,
      [{ type: "shot", actor: 2, target: 0, bullet: "BLANK", damage: 0, killed: false }], BASE(), BASE(), ROSTER)],
    ["M13 SELF-BLANK BONUS", (s) => { const v = BASE(); v.bonus = true; v.current = 1;
      return CHOREO.play(s, [{ type: "shot", actor: 1, target: 1, bullet: "BLANK", damage: 0, killed: false }], BASE(), v, ROSTER); }],
    ["M14 DEATH (burned)", (s) => CHOREO.play(s,
      [{ type: "shot", actor: 0, target: 4, bullet: "LIVE", damage: 1, killed: true },
       { type: "elimination", actor: 0, target: 4 }], BASE(), dead4(), ROSTER)],
    ["M15 KILLER'S EXTRA TURN", (s) => { const v = dead4(); v.extra_turn = true; v.current = 0;
      return CHOREO.play(s, [], BASE(), v, ROSTER); }],
    ["M16 RELOAD (in their honor)", (s) => CHOREO.play(s,
      [{ type: "elimination", actor: 0, target: 4 }, { type: "reload", total: 6, live: 3 }], BASE(), dead4(), ROSTER)],
    ["M17 ITEM DRAW (yours + FULL bounce)", (s) => CHOREO.play(s,
      [{ type: "draw", you: { attempted: ["POISON", "MAGNET"], received: ["POISON"] } }], BASE(), BASE(), ROSTER)],
    ["M17b DRAW (public copy)", (s) => CHOREO.play(s, [{ type: "draw" }], BASE(), BASE(), ROSTER)],
    ["M18 PASSPORT (heal)", (s) => CHOREO.play(s, [{ type: "item", actor: 2, item: "PASSPORT", target: 2 }], BASE(), BASE(), ROSTER)],
    ["M19 GEIGER (scan chip)", async (s) => {
      await CHOREO.play(s, [{ type: "item", actor: 0, item: "GEIGER", target: null }], BASE(), BASE(), ROSTER);
      s.setScan({ live: 2, of: 2 }); await s.w(1500); s.setScan({ live: 1, of: 2 }); await s.w(1200); s.setScan(null);
    }],
    ["M20 POISON (armed)", (s) => { const v = BASE(); v.poison_armed = true;
      return CHOREO.play(s, [{ type: "item", actor: 3, item: "POISON", target: null }], BASE(), v, ROSTER); }],
    ["M21 TERMS (envelope chip)", (s) => { const v = BASE(); v.players[1].immune_from = [0];
      return CHOREO.play(s, [{ type: "item", actor: 0, item: "TERMS", target: 1 }], BASE(), v, ROSTER); }],
    ["M22 MAGNET (bullet out)", (s) => CHOREO.play(s, [{ type: "item", actor: 1, item: "MAGNET", target: null }], BASE(), BASE(), ROSTER)],
    ["M23 SHAKEDOWN + THE SKIP", (s) => CHOREO.play(s,
      [{ type: "item", actor: 3, item: "SHAKEDOWN", target: 2 }, { type: "skip", target: 2 }], BASE(), BASE(), ROSTER)],
    ["M24 CAP HIT", (s) => { const p = BASE(); p.use_counts = { MAGNET: 5 }; const v = BASE(); v.use_counts = { MAGNET: 6 };
      return CHOREO.play(s, [], p, v, ROSTER); }],
    ["M25 FLIP (polarity snap)", (s) => { const v = BASE(); v.players[1].team = "RED";
      return CHOREO.play(s, [{ type: "flip", actor: 0, target: 1 }], BASE(), v, ROSTER); }],
    ["M26 TRADE — public card-backs", (s) => CHOREO.play(s, [{ type: "trade", actor: 2, target: 4 }], BASE(), BASE(), ROSTER)],
    ["M26b TRADE — party view (real items)", (s) => CHOREO.play(s,
      [{ type: "trade", actor: 0, target: 2, items: { give: ["MAGNET"], want: ["PASSPORT"] } }], BASE(), BASE(), ROSTER)],
    ["M26c TRADE CANCELLED (bluff exposed)", (s) => CHOREO.play(s, [{ type: "trade_private", kind: "cancelled" }], BASE(), BASE(), ROSTER)],
    ["M26d BOT GIFT", (s) => CHOREO.play(s, [{ type: "gift", actor: 1, target: 3 }], BASE(), BASE(), ROSTER)],
    ["M27 AGENCIES DISSOLVED", (s) => { const v = BASE(); v.teams_active = false;
      return CHOREO.play(s, [], BASE(), v, ROSTER); }],
    ["M27b FLIP PRESSURE BAND", async (s) => {
      s.setBand({ phase: "talk", secs: 44, name: "VESPER",
        note: "ONE AGENCY HOLDS THE TRAIN — TURN SOMEONE, OR FACE THE GUN" });
      await s.w(2500); s.setBand({ phase: "talk", secs: 60, name: "VESPER" });
    }],
    ["M28 WINNER", (s) => { const v = dead4(); v.winner = 0; return CHOREO.play(s, [], BASE(), v, ROSTER); }],
  ];

  let scene = null, i = 0, running = false;
  SCENE.ready = (s) => { scene = s; s.render(BASE(), ROSTER); s.setBand({ phase: "talk", secs: 60, name: "GALLERY" }); };
  new Phaser.Game({ type: Phaser.AUTO, parent: "stage", width: SCENE.W, height: SCENE.H,
    backgroundColor: "#000000", pixelArt: true,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH }, scene: SCENE.TableScene });

  document.addEventListener("pointerdown", async () => {
    if (!scene) return;
    if (running) { CHOREO.skip(); return; }                    // tap mid-moment = skip (prove skippability)
    running = true;
    const [label, run] = MOMENTS[i % MOMENTS.length];
    hud.textContent = (i % MOMENTS.length + 1) + "/" + MOMENTS.length + " · " + label;
    i++;
    try { await run(scene); } catch (err) { hud.textContent = "ERR " + label + ": " + err.message; console.error(err); }
    scene.render(BASE(), ROSTER);
    running = false;
  }, true);
})();
</script></body></html>
