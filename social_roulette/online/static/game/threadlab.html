<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>THREAD LAB</title>
<!-- DEV-ONLY interactive sampler for the click-thread menu variants (not linked from the game).
     Tap a variant, then play the 4-step SEDATIVE chain by hand. -->
<style>
  html,body{margin:0;height:100%;background:#000;font-family:Georgia,'Times New Roman',serif}
  #bar{display:flex;gap:8px;justify-content:center;padding:8px;background:#000}
  #bar button{background:#000;color:#fff;border:2px solid #fff;font:bold 13px Georgia,serif;
    letter-spacing:1px;padding:6px 10px;cursor:pointer}
  #bar button.dim{border-color:#555;color:#888}
  #wrap{position:absolute;top:44px;bottom:0;left:0;right:0}
</style>
</head><body>
<div id="bar">
  <button id="go">OPEN — YOUR MOVE</button>
</div>
<div id="wrap"><div id="stage" style="width:100%;height:100%"></div></div>
<script src="/static/vendor/phaser.min.js"></script>
<script>
  for (const f of ["theme", "dice", "net", "scene", "choreo", "trays"])
    document.write('<script src="/static/game/js/' + f + '.js?cb=' + Date.now() + '"><\/script>');
</script>
<script>
(function () {
  "use strict";
  const BASE = {
    you: 0, order: [0, 1, 2, 3, 4], current: 0, winner: null, gen: 1,
    phase: "talk", phase_ends_at: null, server_now: 0, bonus: false, extra_turn: false,
    saw_active: false, teams_active: true, flipback_discount: false,
    use_counts: {}, use_limit: 6, feed: [],
    players: [
      { id: 0, team: "RED",  lives: 3, alive: true, handcuffed: false, immune_from: [] },
      { id: 1, team: "BLUE", lives: 3, alive: true, handcuffed: false, immune_from: [] },
      { id: 2, team: "RED",  lives: 2, alive: true, handcuffed: true,  immune_from: [3] },
      { id: 3, team: "BLUE", lives: 3, alive: true, handcuffed: false, immune_from: [] },
      { id: 4, team: "RED",  lives: 1, alive: true, handcuffed: false, immune_from: [] },
    ],
    your_hand: { BEER: 1, HANDCUFFS: 1, MAGNIFIER: 1 }, item_counts: {}, peek: "unknown",
  };
  const ROSTER = { "0": "S.S." };
  let scene = null;

  const KIT = [
    { label: "MAGNET", badge: "×1" }, { label: "SEDATIVE", badge: "×1", bright: true },
    { label: "SPYCAM", badge: "×1" }, { label: "POISON", badge: "×0", dim: true },
    { label: "PASSPORT", badge: "×0", dim: true }, { label: "BLACKMAIL", badge: "×0", dim: true }];
  const name = (id) => THEME.seatName(id, ROSTER);

  function open() {
    if (!scene) return;
    const th = scene.openThread({ mode: "fade", anim: "decode", title: "YOUR MOVE" });
    const hist = [];                                    // step stack — BACK pops one level
    const show = (fn) => { hist.push(fn); fn(); };
    th.onBack = () => { if (hist.length < 2) return; th.back(); hist.pop(); hist[hist.length - 1](); };
    const confirm = (label) => show(() => {
      th.list("GO", "CONFIRM — " + label, [
        { label: "✓ EXECUTE", bright: true }, { label: "✕ STAND DOWN" }]);
      th.onRow = async (i) => { await th.lock(i); scene.time.delayedCall(500, () => scene.closeThread()); };
    });
    const kit = () => show(() => {
      th.list("KIT", "YOUR KIT · 3 CARRIED", KIT);
      th.onRow = async (i) => {
        if (KIT[i].label === "SEDATIVE") {
          const id = await th.pickSeat("item", [2, 4], "SEDATIVE — TAP A NEIGHBOR");
          if (id == null) return;                       // cancel — the kit list is still open
          await th.lock(i); confirm("SEDATIVE → " + name(id));
        } else { await th.lock(i); confirm(KIT[i].label); }
      };
    });
    show(() => {
      th.list("MOVE", "CHOOSE", [
        { label: "SHOOT", bright: true }, { label: "ITEM" }, { label: "TRADE" }]);
      th.onRow = async (i) => {
        if (i === 0) {
          const id = await th.pickSeat("shoot", [1, 3], "SHOOT — TAP A TARGET");
          if (id == null) return;
          await th.lock(0); confirm("SHOOT " + name(id));
        } else if (i === 1) { await th.lock(1); kit(); }
        else {
          const id = await th.pickSeat("trade", [2, 4], "TRADE — TAP A TEAMMATE");
          if (id == null) return;
          await th.lock(2); confirm("TRADE → " + name(id));
        }
      };
    });
  }
  document.getElementById("go").onclick = open;

  SCENE.ready = (s) => {
    scene = s; s.render(BASE, ROSTER); s.setAction("YOUR\nMOVE", true);
    const auto = new URLSearchParams(location.search).get("auto");   // smoke-test hook
    if (auto) s.time.delayedCall(400, open);
  };
  new Phaser.Game({
    type: Phaser.AUTO, parent: "stage", width: SCENE.W, height: SCENE.H,
    backgroundColor: "#000000", pixelArt: true,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: SCENE.TableScene,
  });
})();
</script></body></html>
